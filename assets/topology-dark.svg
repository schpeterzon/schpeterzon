<svg xmlns="http://www.w3.org/2000/svg" width="860" height="452" viewBox="0 0 860 452" role="img" aria-labelledby="title desc"><title id="title">Infrastructure map</title><desc id="desc">Infrastructure map: internet to cloudflare, cloudflare to docker, rackintosh to docker, forest to docker, rackintosh to k3s, silicium to k3s, forest to k3s, docker to media, docker to cloud, docker to network, k3s to network, k3s to platform.</desc><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.tx{fill:#e6edf3}.mu{fill:#8b949e}.fa{fill:#6e7681}
.lbl{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.14em;fill:#8b949e}
.in{animation:fade .8s ease-out both}
.draw{stroke-dasharray:1;animation:draw 1.6s cubic-bezier(.3,.7,.2,1) both}
.pulse{opacity:0;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes fade{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes pulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
